<!-- templates/simple_index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Anime Search</title>
    <style>
        #searchInput { width: 100%; padding: 10px; margin: 20px 0; }
        #searchResults { border: 1px solid #ccc; max-height: 300px; overflow-y: auto; }
        .result-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .result-item:hover { background: #f0f0f0; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='recScript.js') }}"></script>
</head>
<body>
    <h1>Anime Recommender System</h1>
    <div class="container">
        <div class="row">
            <div class="col-md-8 border border-5 rounded p-3">
                <h1>Anime Search</h1>
                <input type="text" id="searchInput" placeholder="Search anime...">
                <div id="searchResults"></div>

                <script>
                    document.getElementById('searchInput').addEventListener('input', function(e) {
                        const query = e.target.value.trim();
                        if (query.length < 2) {
                            document.getElementById('searchResults').innerHTML = '';
                            return;
                        }
                        
                        fetch(`/search?q=${encodeURIComponent(query)}`)
                            .then(r => r.json())
                            .then(results => {
                                const html = results.map(anime => 
                                    `<div class="result-item" data-anime-id="${anime.anime_id}">${anime.name}</div>`
                                ).join('');
                                document.getElementById('searchResults').innerHTML = html;
                            });
                    });

                    // Handle clicks on search results
                    document.getElementById('searchResults').addEventListener('click', function(e) {
                        if (e.target.classList.contains('result-item')) {
                            const anime_id = e.target.getAttribute('data-anime-id');
                            fetchAnimeDetails(anime_id);
                        }
                    });

                    // Fetch anime details through your backend proxy
                    async function fetchAnimeDetails(anime_id) {
                        if (!anime_id) return;
                        
                        try {
                            console.log('Fetching details for anime ID:', anime_id);
                            
                            const response = await fetch(`/api/anime/${anime_id}`);
                            
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            
                            const jsonElements = await response.json();
                            console.log('Received anime details:', jsonElements);
                            if (result) {
                                document.getElementById("result").style.visibility = "visible";
                                function displayData(animeData) {
                                    const imageElement = document.getElementById('animeImage');
                                    const titleElement = document.getElementById('title');
                                    const synopsisElement = document.getElementById('synopsis');
                                    const malRankElement = document.getElementById('malRank');
                                    const ratingElement = document.getElementById('ratingPopularity');
                                    const genresElement = document.getElementById('genres');
                                    const mediaTypeElement = document.getElementById('mediaType');
                                    const animeIdInput = document.getElementById('anime_id');
                                    if (animeIdInput) {
                                        animeIdInput.value = anime_id || '';
                                    }
                                    if (imageElement) {
                                        imageElement.src = animeData.main_picture.large || '';
                                    }
                                    if (titleElement) {
                                        titleElement.innerText = animeData.title || 'N/A';
                                    }
                                    if (synopsisElement) {
                                        synopsisElement.innerText = animeData.synopsis || 'N/A';
                                    }
                                    if (malRankElement) {
                                        malRankElement.innerText = animeData.rank || 'N/A';
                                    }
                                    if(ratingElement){
                                        ratingElement.innerText = animeData.popularity || 'N/A';
                                    }
                                    if (genresElement) {
                                        const genres = animeData.genres ? animeData.genres.map(g => g.name).join(', ') : 'N/A';
                                        genresElement.innerText = genres;
                                    }
                                    if (mediaTypeElement) {
                                        mediaTypeElement.innerText = animeData.media_type || 'N/A';
                                    }
                                }
                            } else {
                                console.error('Element with id "result" not found');
                                // Create the element or show alert
                                alert('Anime details: ' + JSON.stringify(result, null, 2));
                            }
                            displayData(jsonElements);

                        } catch (error) {
                            console.error('Error:', error);
                            
                            const resultElement = document.getElementById('result');
                            if (resultElement) {
                                resultElement.innerText = 'An error occurred while fetching anime details.';
                            } else {
                                console.error('Error and result element not found');
                            }
                        }
                    }
                </script>

                <div id="selectedAnime" style="visibility: hidden;">
                    <div id="result">
                        <div class="row">
                            <div class="col-md-6">
                                <img src="" alt="Chosen Image" class="img-fluid" id="animeImage"><br>
                            </div>
                            <div class="col-md-6">
                                <h1 id="title">Chosen Anime</h1><br>
                                <p id="synopsis"></p><br>
                                <strong>MyAnimeList Rank:</strong><p id="malRank"></p>
                                <strong>Average Rating:</strong><p id="ratingPopularity"></p>
                                <strong>Genres:</strong><p id="genres"></p>
                                <strong>Media Type:</strong><p id="mediaType"></p>

                                <form method="post" id="recommendationForm">
                                    <input type="hidden" name="anime_id" id="anime_id" value="">
                                    <!-- <div class="input-group">
                                        <span class="input-group-text" id="basic-addon3">Your Rating: </span>
                                        <input type="number" class="form-control" id="rating" max="10" min="0" name="rating" required>
                                    </div> -->
                                    <button type="submit" class="btn btn-primary">Get Recommendations</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                    document.getElementById('recommendationForm').addEventListener('submit', async function(event) {
                    event.preventDefault();
                    
                    const anime_id = document.getElementById('anime_id').value;
                    console.log('Anime ID to submit:', anime_id);

                    // Create JSON payload
                    const data = {
                        'anime_id': anime_id
                    };
                    console.log('Data to be sent:', data);
                    try {
                        const response = await fetch('http://127.0.0.1:5000/api/create_user_recommendations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                        });

                        const result = await response.json();
                        console.log('Received recommendation result:', result);
                        addRecommendationCard(result);

                    } catch (error) {
                        console.error('Error:', error);
                        console.log(data);
                        document.getElementById('result').innerText = 'An error occurred while making the prediction.';
                    }
                });
                </script>
            </div>
            <div class="col-md-4 border border-5 rounded p-3">
                <h2>Recommendations</h2>
                <div id="recommendationsList">
                </div>
        </div>
    </div>
</body>
</html>
